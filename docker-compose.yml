version: '3.8'

services:
  # Web Application Server
  web:
    build: .
    container_name: elephant_app
    restart: always
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=elephant_db
      - DB_USER=postgres
      - DB_PASSWORD=Namzom
    depends_on:
      - db

  # Database Server (PostgreSQL + PostGIS)
  db:
    image: postgis/postgis:15-3.3
    container_name: elephant_db
    restart: always
    environment:
      - POSTGRES_DB=elephant_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Namzom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
